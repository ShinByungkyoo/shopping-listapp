<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .app {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    padding: 28px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
    color: #2d3748;
  }
  .subtitle {
    color: #718096;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  #item-input:focus { border-color: #4299e1; }
  #add-btn {
    padding: 0 20px;
    font-size: 1rem;
    background: #4299e1;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #add-btn:hover { background: #3182ce; }
  #add-btn:active { background: #2b6cb0; }
  #add-btn:disabled { background: #cbd5e0; cursor: default; }
  .stats {
    display: flex;
    justify-content: space-between;
    color: #718096;
    font-size: 0.85rem;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  #clear-checked {
    background: none;
    border: none;
    color: #e53e3e;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0;
  }
  #clear-checked:hover { text-decoration: underline; }
  #clear-checked:disabled { color: #cbd5e0; cursor: default; text-decoration: none; }
  ul#list {
    list-style: none;
  }
  li {
    display: flex;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px solid #edf2f7;
    gap: 12px;
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #4299e1;
    flex-shrink: 0;
  }
  li .text {
    flex: 1;
    font-size: 1rem;
    color: #2d3748;
    word-break: break-word;
  }
  li.done .text {
    text-decoration: line-through;
    color: #a0aec0;
  }
  li .delete {
    background: none;
    border: none;
    color: #cbd5e0;
    cursor: pointer;
    font-size: 1.3rem;
    padding: 4px 8px;
    line-height: 1;
    transition: color 0.15s;
  }
  li .delete:hover { color: #e53e3e; }
  .empty {
    text-align: center;
    color: #a0aec0;
    padding: 32px 0;
    font-size: 0.95rem;
  }
  .status {
    text-align: center;
    color: #a0aec0;
    padding: 8px 0;
    font-size: 0.85rem;
    min-height: 1.4em;
  }
  .status.error { color: #e53e3e; }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <p class="subtitle">사야 할 것들을 잊지 마세요</p>

  <form id="add-form" class="input-row">
    <input id="item-input" type="text" placeholder="추가할 아이템 입력..." maxlength="100" autofocus required>
    <button type="submit" id="add-btn">추가</button>
  </form>

  <div class="stats">
    <span id="count-text">0개 항목</span>
    <button type="button" id="clear-checked" disabled>체크된 항목 삭제</button>
  </div>

  <ul id="list"></ul>
  <p id="empty-state" class="empty" hidden>아직 추가된 항목이 없습니다</p>
  <p id="status" class="status">불러오는 중...</p>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://pihdesvppnzbrdizjuot.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_BlR1vuSlnOl3deHcx3MK1w_mRu9Ua43";
  const TABLE = "shopping_items";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("add-form");
  const input = document.getElementById("item-input");
  const addBtn = document.getElementById("add-btn");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty-state");
  const countText = document.getElementById("count-text");
  const clearBtn = document.getElementById("clear-checked");
  const statusEl = document.getElementById("status");

  let items = [];

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle("error", isError);
    statusEl.hidden = !msg;
  }

  async function loadItems() {
    const { data, error } = await supabase
      .from(TABLE)
      .select("id, text, done, created_at")
      .order("created_at", { ascending: true });
    if (error) {
      setStatus(`불러오기 실패: ${error.message}`, true);
      return;
    }
    items = data ?? [];
    setStatus("");
    render();
  }

  async function addItem(text) {
    const { data, error } = await supabase
      .from(TABLE)
      .insert({ text, done: false })
      .select()
      .single();
    if (error) {
      setStatus(`추가 실패: ${error.message}`, true);
      return;
    }
    items.push(data);
    render();
  }

  async function toggleItem(id, done) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const prev = item.done;
    item.done = done;
    render();
    const { error } = await supabase
      .from(TABLE)
      .update({ done })
      .eq("id", id);
    if (error) {
      item.done = prev;
      setStatus(`업데이트 실패: ${error.message}`, true);
      render();
    }
  }

  async function deleteItem(id) {
    const prev = items;
    items = items.filter(i => i.id !== id);
    render();
    const { error } = await supabase.from(TABLE).delete().eq("id", id);
    if (error) {
      items = prev;
      setStatus(`삭제 실패: ${error.message}`, true);
      render();
    }
  }

  async function clearChecked() {
    const checkedIds = items.filter(i => i.done).map(i => i.id);
    if (checkedIds.length === 0) return;
    const prev = items;
    items = items.filter(i => !i.done);
    render();
    const { error } = await supabase.from(TABLE).delete().in("id", checkedIds);
    if (error) {
      items = prev;
      setStatus(`삭제 실패: ${error.message}`, true);
      render();
    }
  }

  function render() {
    listEl.replaceChildren();

    for (const item of items) {
      const li = document.createElement("li");
      li.dataset.id = item.id;
      if (item.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = item.done;
      checkbox.dataset.action = "toggle";

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = item.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete";
      del.textContent = "×";
      del.dataset.action = "delete";
      del.setAttribute("aria-label", `${item.text} 삭제`);

      li.append(checkbox, text, del);
      listEl.append(li);
    }

    const checkedCount = items.filter(i => i.done).length;
    countText.textContent = `${items.length}개 항목 · ${checkedCount}개 완료`;
    clearBtn.disabled = checkedCount === 0;
    emptyEl.hidden = items.length > 0;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addBtn.disabled = true;
    await addItem(text);
    addBtn.disabled = false;
    input.focus();
  });

  // Delegated handlers — one listener per event type for the whole list.
  listEl.addEventListener("change", e => {
    if (e.target.dataset.action !== "toggle") return;
    const id = e.target.closest("li")?.dataset.id;
    if (id) toggleItem(id, e.target.checked);
  });

  listEl.addEventListener("click", e => {
    if (e.target.dataset.action !== "delete") return;
    const id = e.target.closest("li")?.dataset.id;
    if (id) deleteItem(id);
  });

  clearBtn.addEventListener("click", clearChecked);

  loadItems();
</script>
</body>
</html>
